name: Update jobs

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may start it a few minutes late)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch jobs
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          JOB_LOCATION: "Qatar"
          JOB_KEYWORDS: ""
          JOB_PAGES: "2"
        run: python fetch_jobs.py

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git diff --staged --quiet || git commit -m "Update jobs"
          git push
