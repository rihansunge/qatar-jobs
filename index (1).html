<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qatar Jobs Board</title>
<style>
  :root { --bg:#f4f6f8; --card:#ffffff; --text:#1a2230; --muted:#5a6678; --line:#d8dee6; --accent:#8a1538; --accent-text:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12141a; --card:#1b1e27; --text:#eceff4; --muted:#9ba5b6; --line:#2c313d; --accent:#e0567d; --accent-text:#1a0510; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:2rem; margin:20px 0 4px; letter-spacing:-0.02em; }
  .tag { color:var(--muted); margin:0 0 16px; }
  .note { font-size:.88rem; color:var(--muted); border-left:3px solid var(--accent); padding:4px 12px; margin:0 0 20px; }
  input[type=search] { width:100%; padding:12px 14px; font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:8px; }
  input[type=search]:focus-visible, .btn:focus-visible, .more:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .meta { font-size:.85rem; color:var(--muted); margin:10px 0 16px; }
  article { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:12px; }
  article h2 { font-size:1.1rem; margin:0 0 2px; line-height:1.3; }
  .co { color:var(--muted); margin:0 0 8px; font-size:.95rem; }
  .snip { margin:0 0 12px; font-size:.95rem; }
  .row { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; justify-content:space-between; font-size:.85rem; color:var(--muted); }
  .btn { display:inline-block; background:var(--accent); color:var(--accent-text); text-decoration:none; padding:8px 16px; border-radius:8px; font-weight:600; }
  .more { display:block; margin:16px auto 0; padding:10px 20px; font:inherit; font-weight:600; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:8px; cursor:pointer; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  footer { font-size:.82rem; color:var(--muted); margin-top:32px; }
  footer a { color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Qatar Jobs Board</h1>
  <p class="tag">Latest job listings in Qatar, checked every 15 minutes.</p>
  <p class="note">Always verify an employer before applying, and never pay a fee to get a job. Each listing links to the original posting; we do not run the hiring.</p>
  <input id="q" type="search" placeholder="Search by job title, company or area" aria-label="Search jobs">
  <p class="meta" id="meta">Loading jobs…</p>
  <main id="list"></main>
  <button class="more" id="more" hidden>Show more jobs</button>
  <footer>Job data provided by <a href="https://jooble.org" target="_blank" rel="noopener">Jooble</a>.</footer>
</div>
<script>
  const PAGE = 30;
  let jobs = [], shown = PAGE, query = '';
  const list = document.getElementById('list'), meta = document.getElementById('meta'), more = document.getElementById('more');

  function el(tag, props, kids) {
    const n = document.createElement(tag);
    Object.assign(n, props || {});
    (kids || []).forEach(k => n.append(k));
    return n;
  }
  function ago(iso) {
    if (!iso) return '';
    const d = new Date(iso); if (isNaN(d)) return '';
    const mins = Math.round((Date.now() - d) / 60000);
    if (mins < 60) return Math.max(mins, 1) + ' min ago';
    if (mins < 1440) return Math.round(mins / 60) + ' h ago';
    return Math.round(mins / 1440) + ' d ago';
  }
  function draw() {
    const q = query.trim().toLowerCase();
    const hits = jobs.filter(j => !q || (j.title + ' ' + j.company + ' ' + j.location).toLowerCase().includes(q));
    list.textContent = '';
    if (!hits.length) {
      list.append(el('p', { className: 'empty', textContent: jobs.length ? 'No jobs match your search.' : 'No jobs yet. The first update will fill this page.' }));
    }
    hits.slice(0, shown).forEach(j => {
      const row = el('div', { className: 'row' }, [
        el('span', { textContent: [j.location, j.type, j.salary].filter(Boolean).join(' · ') }),
        el('span', { textContent: 'Posted ' + (j.posted || '') })
      ]);
      const card = el('article', {}, [
        el('h2', { textContent: j.title }),
        el('p', { className: 'co', textContent: j.company || 'Company not listed' }),
        el('p', { className: 'snip', textContent: j.snippet || '' }),
        row
      ]);
      if (/^https:\/\//.test(j.link)) {
        card.append(el('p', {}, [el('a', { className: 'btn', href: j.link, textContent: 'View and apply', target: '_blank', rel: 'noopener nofollow' })]));
      }
      list.append(card);
    });
    more.hidden = hits.length <= shown;
    meta.textContent = hits.length + ' job' + (hits.length === 1 ? '' : 's');
  }
  document.getElementById('q').addEventListener('input', e => { query = e.target.value; shown = PAGE; draw(); });
  more.addEventListener('click', () => { shown += PAGE; draw(); });

  fetch('jobs.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(d => {
      jobs = d.jobs || [];
      draw();
      if (d.updated_at) meta.textContent += ' · updated ' + ago(d.updated_at);
    })
    .catch(() => { meta.textContent = 'Could not load jobs.'; });
</script>
</body>
</html>
